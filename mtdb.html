<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máy Tính Cà Phê - Chống Xóa Nhầm & An Toàn Dữ Liệu</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 10px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            height: 96vh;
        }
        h2 {
            text-align: center;
            color: #ffca28;
            margin: 5px 0 10px 0;
            font-size: 20px;
        }
        
        /* Khu vực 4 ô nhập liệu phía trên */
        .header-inputs {
            background-color: #2c2c2c;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            flex-shrink: 0;
        }
        .input-group {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .input-group label {
            font-size: 15px;
            font-weight: bold;
            color: #4fc3f7;
        }
        .input-group input {
            width: 50%;
            font-size: 18px;
            padding: 5px;
            text-align: right;
            border-radius: 6px;
            border: 2px solid #4fc3f7;
            font-weight: bold;
        }
        .btn-add {
            width: 100%;
            background-color: #2e7d32;
            color: white;
            font-size: 20px;
            font-weight: bold;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 5px;
        }
        .btn-add:active {
            background-color: #1b5e20;
        }
        
        /* Bảng danh sách cuộn trôi */
        .table-container {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 10px;
            border: 1px solid #444;
            border-radius: 8px;
            background-color: #181818;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }
        th {
            background-color: #333;
            color: #ffb74d;
            font-size: 14px;
            padding: 8px 4px;
            position: sticky;
            top: 0;
            z-index: 2;
            border-bottom: 2px solid #555;
        }
        td {
            padding: 7px 4px;
            border-bottom: 1px solid #333;
            font-size: 15px;
            font-weight: bold;
        }
        .col-roman { color: #ffca28; width: 12%; font-size: 16px; }
        .col-kg { color: #ffffff; width: 22%; }
        .col-price { color: #81c784; width: 33%; }
        .col-action { width: 33%; }

        /* Tách rời nút Đọc và nút Xóa để chống bấm nhầm */
        .btn-speak {
            background-color: #0288d1;
            color: white;
            border: none;
            padding: 5px 10px;
            font-size: 13px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-del {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 5px 10px;
            font-size: 13px;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 8px;
        }

        /* DÒNG TỔNG KẾT MỐC NỔI BẬT */
        .summary-row {
            background-color: #004d40 !important;
            border-top: 2px solid #00bfa5;
            border-bottom: 2px solid #00bfa5;
        }
        .summary-text {
            color: #69f0ae !important;
            font-size: 15px !important;
            font-weight: bold;
            padding: 10px 5px !important;
        }

        /* Khung Tổng Cân cố định ở đáy */
        .footer-fixed {
            flex-shrink: 0;
            background-color: #1e1e1e;
            padding-top: 5px;
            border-top: 1px solid #333;
        }
        .total-box {
            background-color: #4d0004;
            border: 2px solid #00bfa5;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        .total-box div {
            font-size: 18px;
            font-weight: bold;
            margin: 2px 0;
        }
        .total-kg { color: #ffffff; }
        .total-money { color: #69f0ae; font-size: 22px !important; }

        .summary-actions {
            display: flex;
            gap: 5px;
            margin-top: 8px;
        }
        .btn-speak-total {
            flex: 1;
            background-color: #00838f;
            color: white;
            font-size: 13px;
            font-weight: bold;
            padding: 7px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-speak-total:active {
            background-color: #005662;
        }

        /* Nút Khôi phục dòng vừa xóa */
        .btn-undo {
            width: 100%;
            background-color: #f57c00;
            color: white;
            font-size: 14px;
            font-weight: bold;
            padding: 6px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 6px;
            display: none; /* Chỉ hiện khi vừa xóa xong */
        }
        
        .btn-clear-all {
            width: 100%;
            background-color: #c62828;
            color: white;
            font-size: 15px;
            font-weight: bold;
            padding: 7px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>MÁY TÍNH THÔNG MINH</h2>
    <div class="total-box">
            <div class="total-kg">TỔNG : <span id="totalKgDisplay">0</span>kg</div>
            <div class="total-money">TỔNG TIỀN: <span id="totalMoneyDisplay">0</span>Đ</div>
        </div>
    
    <!-- KHU VỰC 4 Ô NHẬP LIỆU -->
    <div class="header-inputs">
        <div class="input-group">
            <label for="unitPrice">giá:</label>
            <input type="number" id="unitPrice" value="" onchange="capNhatToanBo()">
        </div>
        <div class="input-group">
            <label for="stepInput" style="color: #ffb74d;">Mốc mã:</label>
            <input type="number" id="stepInput" value="" min="" onchange="capNhatToanBo()" style="border-color: #ffb74d;">
        </div>
        <div class="input-group">
            <label for="tareInput" style="color: #ff8a65;">Trừ bì:</label>
            <input type="number" id="tareInput" value="" step="" min="" onchange="capNhatToanBo()" style="border-color: #ff8a65;">
        </div>
        <div class="input-group">
            <label for="kgInput">số Kg:</label>
            <input type="number" id="kgInput" placeholder="" autofocus>
        </div>
        <button class="btn-add" onclick="themBaoMoi()">Ok</button>
    </div>

    <!-- Bảng danh sách cuộn trôi bên trong -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>STT</th>
                    <th>Số Kg (Thô)</th>
                    <th>Thành Tiền</th>
                    <th>Thao Tác</th>
                </tr>
            </thead>
            <tbody id="bagList">
                <!-- Dữ liệu tự động thêm -->
            </tbody>
        </table>
    </div>

    <!-- Khung cố định đứng yên phía dưới -->
    <div class="footer-fixed">
        
        <div class="summary-actions">
            <button class="btn-speak-total" onclick="docTongKy()">🔊 Đọc Tổng Ký</button>
            <button class="btn-speak-total" onclick="docTongTien()">🔊 Đọc Tổng Tiền</button>
        </div>

        <!-- Nút khôi phục nhanh nếu lỡ tay xóa -->
        <button id="undoBtn" class="btn-undo" onclick="khoiPhucXoa()">↩️ Khôi phục lại dòng vừa xóa</button>

        <button class="btn-clear-all" onclick="xoaHetDuLieu()">⚠️ XÓA HẾT DỮ LIỆU CÂN</button>
    </div>
</div>

<script>
function toRoman(num) {
        const lookup = {M:1};
        let roman = '', i;
        for (i in lookup) {
            while (num >= lookup[i]) {
                roman += i;
                num -= lookup[i];
            }
        }
        return roman;
    }

    let dsBao = JSON.parse(localStorage.getItem('coffeeDataSafe')) || [];
    let duLieuVuaXoa = null; // Lưu tạm dòng vừa xóa để có thể khôi phục
    let viTriVuaXoa = null;
    let tongKgRongGlobal = 0;
    let tongTienGlobal = 0;

    window.onload = function() {
        let savedStep = localStorage.getItem('coffeeStepSafe');
        if (savedStep !== null) {
            document.getElementById('stepInput').value = savedStep;
        }
        let savedTare = localStorage.getItem('coffeeTareSafe');
        if (savedTare !== null) {
            document.getElementById('tareInput').value = savedTare;
        }
        hienThiDanhSach();
    };

    function docGiangNoi(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            let msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'vi-VN';
            msg.rate = 0.9;
            window.speechSynthesis.speak(msg);
        }
    }

    function themBaoMoi() {
        let kgInput = document.getElementById('kgInput');
        let unitPrice = parseFloat(document.getElementById('unitPrice').value) || 0;
        let step = parseInt(document.getElementById('stepInput').value) || 0;
        let rawKg = parseFloat(kgInput.value);

        if (isNaN(rawKg) || rawKg <= 0) {
            alert('Vui lòng nhập số kg hợp lệ!');
            return;
        }

        dsBao.push({ rawKg: rawKg });
            
            localStorage.setItem('coffeeDataSafe', JSON.stringify(dsBao));
            document.getElementById('undoBtn').style.display = 'none';
            let sttCurrent = dsBao.length;
        
            let loiDoc = `Mã ${sttCurrent}, ${rawKg} ký`;
        
        if (step > 0 && sttCurrent % step === 0) {
            loiDoc += `. Đã tròn ${sttCurrent} con cặc`;
        }

        docGiangNoi(loiDoc);

        kgInput.value = '';
        kgInput.focus();

        hienThiDanhSach();
    }
    function docRiengDong(index, rawKg) {
        docGiangNoi(`Mã ${index + 1}, ${rawKg} ký`);
    }

    function docTongKy() {
        docGiangNoi(`Tổng cộng ${tongKgRongGlobal} ký ròng`);
    }

    function docTongTien() {
        docGiangNoi(`Tổng số tiền là ${tongTienGlobal.toLocaleString('vi-VN')} đồng`);
    }

    function hienThiDanhSach() {
        let tbody = document.getElementById('bagList');
        let unitPrice = parseFloat(document.getElementById('unitPrice').value) || 0;
        let step = parseInt(document.getElementById('stepInput').value) || 0;
        let tare = parseFloat(document.getElementById('tareInput').value) || 0;
        
        localStorage.setItem('coffeeStepSafe', step);
        localStorage.setItem('coffeeTareSafe', tare);
        tbody.innerHTML = '';

        tongKgRongGlobal = 0;
        tongTienGlobal = 0;

        let mocKgRongCurrent = 0;
        let mocTienCurrent = 0;
        let demNhom = 0;

        dsBao.forEach((item, index) => {
            let netKg = item.rawKg - tare;
            if (netKg < 0) netKg = 0;
            let thanhTien = netKg * unitPrice;

            tongKgRongGlobal += netKg;
            tongTienGlobal += thanhTien;

            demNhom++;
            mocKgRongCurrent += netKg;
            mocTienCurrent += thanhTien;

            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="col-stt" style="color: #ffca28;">${(index + 1)}</td>
                <td class="col-kg">${item.rawKg} kg</td>
                <td class="col-price">${thanhTien.toLocaleString('vi-VN')} đ</td>
                <td class="col-action">
                    <button class="btn-speak" onclick="docRiengDong(${index}, ${item.rawKg})">🔊 Đọc</button>
                    <button class="btn-del" onclick="xoaMotMa(${index})">Xóa</button>
                </td>
            `;
            tbody.appendChild(tr);

            if (step > 0 && demNhom === step) {
                let startRoman = toRoman(index - step + 2);
                let endRoman = toRoman(index + 1);
                let trSummary = document.createElement('tr');
                trSummary.className = 'summary-row';
                trSummary.innerHTML = `
        
                    <td colspan="4" class="summary-text">
                        <span style="color: yellow; font-weight: bold";>móc ${step} mã (${index - step + 2} ➔ ${index + 1}): 
                        <b>${mocKgRongCurrent}</b> kg rònng - <span>${mocTienCurrent.toLocaleString('vi-VM')}</span> đ
            
                    </td>
            
                `;
                tbody.appendChild(trSummary);
                
                demNhom = 0;
                mocKgRongCurrent = 0;
                mocTienCurrent = 0;
            }
        });

        document.getElementById('totalKgDisplay').innerText = tongKgRongGlobal.toLocaleString('vi-VN');
        document.getElementById('totalMoneyDisplay').innerText = tongTienGlobal.toLocaleString('vi-VN');

        let container = document.querySelector('.table-container');
        container.scrollTop = container.scrollHeight;
    }

    function xoaMotMa(index) {
        // Hỏi xác nhận trước khi xóa để chống bấm nhầm
        if (confirm(`Bạn có chắc chắn muốn xóa Mã ${toRoman(index + 1)} (${dsBao[index].rawKg} kg) không?`)) {
            // Lưu lại đề phòng muốn khôi phục
            duLieuVuaXoa = dsBao[index];
            viTriVuaXoa = index;

            dsBao.splice(index, 1);
            localStorage.setItem('coffeeDataSafe', JSON.stringify(dsBao));
            hienThiDanhSach();

            // Hiển thị nút Khôi phục lên cho phép lấy lại nếu lỡ tay
            document.getElementById('undoBtn').style.display = 'block';
        }
    }

    function khoiPhucXoa() {
        if (duLieuVuaXoa !== null && viTriVuaXoa !== null) {
            dsBao.splice(viTriVuaXoa, 0, duLieuVuaXoa); // Chèn lại vào vị trí cũ
            localStorage.setItem('coffeeDataSafe', JSON.stringify(dsBao));
            
            duLieuVuaXoa = null;
            viTriVuaXoa = null;
            
            document.getElementById('undoBtn').style.display = 'none';
            hienThiDanhSach();
            docGiangNoi('Đã khôi phục lại dữ liệu');
        }
    }

    function xoaHetDuLieu() {
        if (confirm('⚠️ CHÚ Ý: Hành động này sẽ xóa sạch toàn bộ danh sách cân từ đầu đến cuối. Bạn có chắc chắn không?')) {
            dsBao = [];
            localStorage.removeItem('coffeeDataSafe');
            document.getElementById('undoBtn').style.display = 'none';
            hienThiDanhSach();
            docGiangNoi('Đã xóa toàn bộ dữ liệu');
        }
    }

    function capNhatToanBao() {
        localStorage.setItem('coffeeDataSafe', JSON.stringify(dsBao));
        hienThiDanhSach();
    }
</script>

</body>
</html>
