<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sổ Ghi Chú Khách Hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">
    <div class="container py-4">
        <h3 class="text-center mb-4">Sổ Ghi Chú Khách Hàng</h3>
        
        <div class="card shadow-sm p-3 mb-4 bg-white rounded">
            <div class="row g-2">
                <div class="col-md-5">
                    <input type="text" id="customerName" class="form-control" placeholder="Tên khách hàng">
                </div>
                <div class="col-md-5">
                    <input type="text" id="customerNote" class="form-control" placeholder="Ghi chú (SĐT, nội dung...)">
                </div>
                <div class="col-md-2">
                    <button onclick="addCustomer()" class="btn btn-primary w-100">
                        <i class="fas fa-plus"></i> Thêm
                    </button>
                </div>
            </div>
        </div>

        <div class="card shadow-sm p-3 bg-white rounded">
            <h5 class="mb-3 text-secondary">Danh sách khách hàng</h5>
            <div id="customerList"></div>
        </div>
    </div>

    <script>
        // Tự động nạp lại chính xác danh sách đã lưu trong máy
        let customers = JSON.parse(localStorage.getItem('soGhiChuChuanXac100')) || [];
        let editIndex = -1;

        function renderCustomers() {
            // Sắp xếp tự động theo vần ABC tiếng Việt
            customers.sort((a, b) => a.name.localeCompare(b.name, 'vi', { sensitivity: 'base' }));

            const listEl = document.getElementById('customerList');
            listEl.innerHTML = '';

            if (customers.length === 0) {
                listEl.innerHTML = '<p class="text-muted text-center">Chưa có tên khách hàng nào.</p>';
                return;
            }

            customers.forEach((c, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'border rounded p-3 mb-3 bg-white shadow-sm';
                itemDiv.innerHTML = `
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h6 class="fw-bold text-primary mb-1"><i class="fas fa-user"></i> ${escapeHtml(c.name)}</h6>
                            <p class="text-muted mb-0 small">${c.note ? escapeHtml(c.note) : 'Chưa có ghi chú'}</p>
                        </div>
                        <div>
                            <button onclick="editCustomer(${index})" class="btn btn-warning btn-sm text-white me-1">Sửa</button>
                            <button onclick="deleteCustomer(${index})" class="btn btn-danger btn-sm">Xóa</button>
                        </div>
                    </div>
                `;
                listEl.appendChild(itemDiv);
            });
        }

        function addCustomer() {
            const nameInput = document.getElementById('customerName');
            const noteInput = document.getElementById('customerNote');
            const saveBtn = document.querySelector('.row button');

            const name = nameInput.value.trim();
            const note = noteInput.value.trim();

            if (!name) {
                alert('Vui lòng nhập tên khách hàng!');
                return;
            }

            if (editIndex === -1) {
                customers.push({ name, note });
            } else {
                customers[editIndex] = { name, note };
                editIndex = -1;
                saveBtn.innerHTML = '<i class="fas fa-plus"></i> Thêm';
            }

            nameInput.value = '';
            noteInput.value = '';
            
            // TỰ ĐỘNG LƯU NGAY LẬP TỨC VÀO MÁY
            saveToStorage();
        }

        function editCustomer(index) {
            const nameInput = document.getElementById('customerName');
            const noteInput = document.getElementById('customerNote');
            const saveBtn = document.querySelector('.row button');

            nameInput.value = customers[index].name;
            noteInput.value = customers[index].note;
            editIndex = index;
            saveBtn.innerHTML = '<i class="fas fa-sync-alt"></i> Cập nhật';
            nameInput.focus();
        }

        function deleteCustomer(index) {
            if (confirm('Bạn có chắc chắn muốn xóa tên này không?')) {
                customers.splice(index, 1);
                if (editIndex === index) {
                    editIndex = -1;
                    document.getElementById('customerName').value = '';
                    document.getElementById('customerNote').value = '';
                    document.querySelector('.row button').innerHTML = '<i class="fas fa-plus"></i> Thêm';
                }
                saveToStorage();
            }
        }

        function saveToStorage() {
            localStorage.setItem('soGhiChuChuanXac100', JSON.stringify(customers));
            renderCustomers();
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Mở lên là hiển thị ngay danh sách đã lưu
        renderCustomers();
    </script>
</body>
</html>
