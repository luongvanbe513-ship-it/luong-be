<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title></title>
    <style>
        body {
            background-color: #111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        #hien-thi-chu {
            font-size: 120px;
            color: #ffeb3b;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #ffeb3b;
        }

        .nut-lung-linh {
            padding: 15px 40px;
            font-size: 28px;
            font-weight: bold;
            color: #ffffff;
            background: linear-gradient(45deg, #ff007f, #7f00ff, #00f0ff);
            background-size: 300% 300%;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.8);
            animation: lungLinh 3s ease infinite;
        }

        /* Hiệu ứng viền phát sáng đổi màu */
        @keyframes lungLinh {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .nut-lung-linh:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <button class="nut-lung-linh" onclick="docChuA()">new</button>

    <script>
        function docChuA() {
            // Lệnh phát âm thanh phát ra chữ "A"
            let amThanh = new SpeechSynthesisUtterance("mới");
            amThanh.lang = "vi-VN"; // Giọng đọc tiếng Việt
            window.speechSynthesis.speak(amThanh);
        }
    </script>

</body>
</html>
