<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Giao Diện Proxy Đẹp</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            padding: 20px;
        }
        .card {
            max-width: 350px;
            background: #ffffff;
            border: 2px solid #007bff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h3 {
            color: #007bff;
            margin-top: 0;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        label {
            font-weight: bold;
            font-size: 14px;
        }
        select, input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div class="card">
        <h3>Proxy Dân Cư Viettel, FPT, VNPT</h3>
        
        <form>
            <label>Chọn nhà mạng:</label>
            <select>
                <option>FPT</option>
                <option>Viettel</option>
                <option>VNPT</option>
            </select>

            <label>Ngày sử dụng:</label>
            <input type="number" value="30">

            <label>Số lượng:</label>
            <input type="number" value="1">

            <button type="button">MUA NGAY</button>
        </form>
    </div>

</body>
</html>
