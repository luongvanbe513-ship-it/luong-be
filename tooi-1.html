<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Xếp Ốc Vít</title>
<link rel="stylesheet" href="style.css">
<style>
    #hop {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 20px;
    }
    .o {
        position: relative;
        width: 50px;
        height: 50px;
        background-color: #ccc;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all .8s ease;
        z-index: 1;
    }
    .o.ruongXuong {
        transform: translateY(300px);
        opacity: 0.3;
    }
    .lo {
        width: 20px;
        height: 20px;
        background-color: #333;
        border-radius: 20%;
        position: absolute;
        top: 150px;
        left: 250px;
    
    }
    .vit {
    
        position: absolute;
        top: 90px;
        left: 400px;
        transition: all 0.5s ease; 
        border-radius: 50%;
        width: 10px;
        height: 10px;
        background-color: gold;
        cursor: pointer;
        z-index: 10;
    }
    .o:hover .vit {
        transform: translate(-30px, 0px) r0tate(360deg);
    }
</style>

</head>
<body>

<h2>Mức độ 1</h2>
<div id="hop">
        <div class="vit" onclick="xoayVaolo()"></div>
        <div class="o">
    </div>
    <div class="lo"></div>
</div>
</body>
</html>
<script>
function xoayVaolo() {
    let lo = document.querySelector('.lo');
    let vit = document.querySelector('.vit');
    let o = document.querySelector('.o');

    vit.style.position = "absolute";
    vit.style.top = (lo.offsetTop + 2) + "px";
    vit.style.left = (lo.offsetLeft + 2) + "px";
    vit.style.transform = "rotate(360deg)";
    vit.style.transition = "0.5s";

    o.classList.add('ruongXuong');
}
</script>
